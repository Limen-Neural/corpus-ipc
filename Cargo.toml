# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "corpus-ipc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Inter-Process Communication (IPC) library for bridging Rust to external compute engines via ZeroMQ."
repository = "https://github.com/Limen-Neural/corpus-ipc"
keywords = ["ipc", "zmq", "ffi", "hpc", "compute"]
categories = ["science", "network-programming", "api-bindings"]
exclude = ["docs/"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
zmq = { version = "0.10", optional = true }
axum = { version = "0.7", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", optional = true, default-features = false, features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
zmq = ["dep:zmq"]
# HTTP service stack for `corpus_ipc_server` only. `tower` is a mandatory
# dependency of optional `axum`, not a direct crate dep. `serde_json` is a
# test-only (dev) dependency; Axum's `json` feature also pulls it for the binary.
server = ["dep:axum", "dep:tokio"]

[[bin]]
name = "corpus_ipc_server"
required-features = ["server"]

[workspace]
