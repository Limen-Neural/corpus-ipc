# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "corpus-ipc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
description = "Inter-Process Communication (IPC) library for bridging Rust to external compute engines via ZeroMQ."
repository = "https://github.com/Limen-Neural/corpus-ipc"
homepage = "https://github.com/Limen-Neural/corpus-ipc"
documentation = "https://docs.rs/corpus-ipc"
readme = "README.md"
keywords = ["ipc", "zmq", "ffi", "hpc", "compute"]
categories = ["science", "network-programming", "api-bindings"]
# crates.io surface: explicit allow-list. Only consumer-relevant material
# ships: library/server sources, README, CHANGELOG, licenses, and the
# normative wire-encoding spec linked from README. (Cargo always includes
# the manifest itself, plus Cargo.lock because this package builds a
# binary target, and generates .cargo_vcs_info.json / Cargo.toml.orig.)
# Repo-only material (agent files, CI config, coverage/lint config, the
# rest of docs/, local tooling, governance) is excluded by omission.
# Integration tests and fixtures stay out of the registry artifact; `cargo
# package` / `cargo publish` verify the packaged sources by building them.
include = [
    "/src/**/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE-2.0",
    "/docs/wire-encoding.md",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
# JSON is the current IpcMessage encoding. The compatibility envelope inspects
# `wire_version` on a `serde_json::Value` *before* deserializing the payload,
# so this is a library dependency (not test-only).
serde_json = { version = "1.0", features = ["raw_value"] }
# zmq 0.10 has no `vendored` feature (only `default` / `zmq_has`). zmq-sys
# 0.12 always compiles libzmq from `zeromq-src`; a system libzmq is not required.
zmq = { version = "0.10", optional = true }
axum = { version = "0.7", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", optional = true, default-features = false, features = ["macros", "net", "rt-multi-thread"] }

[features]
default = []
zmq = ["dep:zmq"]
# HTTP service stack for `corpus_ipc_server` only. `tower` is a mandatory
# dependency of optional `axum`, not a direct crate dep. Axum's `json` feature
# also pulls `serde_json` for the binary; the library already depends on it for
# the compatibility envelope decoder.
server = ["dep:axum", "dep:tokio"]

[[bin]]
name = "corpus_ipc_server"
required-features = ["server"]

[[test]]
name = "zmq_golden_readout"
path = "tests/zmq_golden_readout.rs"
required-features = ["zmq"]

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"

[package.metadata.docs.rs]
# Default crate only. The `zmq` feature compiles vendored C++ via zmq-sys.
all-features = false

[workspace]
# `ci/ap-check` is a CI-only member (publish = false) that proves canonical
# encoding stays independent of serde_json `arbitrary_precision`. It is not
# part of the published corpus-ipc artifact (see the `include` allow-list).
members = ["ci/ap-check"]
