# Codecov coverage workflow (separate from main CI per observability split).
# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
#
# Pattern: limbic-critic / synaptic-mesh (llvm-cov + org CODECOV_TOKEN).
# Slug is Limen-Neural/corpus-ipc (canonical home after transfer).
# Codecov requires CODECOV_TOKEN for this org (tokenless returns HTTP 400).
# Uploads are non-blocking (fail_ci_if_error: false).
name: Codecov

on:
  push:
    branches: [main]
  # Every PR (not only those targeting main) so stacked branches still upload.
  pull_request:

permissions:
  contents: read

jobs:
  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # pinned (taiki-e/install-action v2)
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          disable_search: true
          slug: Limen-Neural/corpus-ipc
          fail_ci_if_error: false
          verbose: true
