name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false

      # libzmq 4.3.4 SIGSEGVs in pipe_t::process_pipe_term_ack on the
      # ubuntu-26.04 runner (zeromq/libzmq#4806). Linux compiles go through
      # scripts/cxx-libzmq-pipefix.sh, which applies the upstream fix.
      - name: Use patched libzmq C++ driver
        if: runner.os == 'Linux'
        run: |
          echo "CORPUS_IPC_REAL_CXX=${CXX:-g++}" >> "$GITHUB_ENV"
          echo "CXX=$GITHUB_WORKSPACE/scripts/cxx-libzmq-pipefix.sh" >> "$GITHUB_ENV"

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - name: Cache cargo registry and git
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Check default features
        run: cargo check --no-default-features

      - name: Check server feature
        run: cargo check --features server

      - name: Check zmq feature
        if: runner.os == 'Linux'
        run: cargo check --features zmq

      - name: Assert default tree excludes HTTP and ZMQ stacks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --no-default-features --edges normal)
          echo "$tree"
          if echo "$tree" | grep -E '(^|[[:space:]])(axum|tokio|tower|zmq) v'; then
            echo "default feature graph must not include axum, tokio, tower, or zmq"
            exit 1
          fi

      - name: Clippy (all features)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (server, no zmq)
        if: runner.os != 'Linux'
        run: cargo clippy --all-targets --features server -- -D warnings

      - name: Build default + server
        run: cargo build --features server

      - name: Build all features
        if: runner.os == 'Linux'
        run: cargo build --all-features

      - name: Test default + server
        run: cargo test --features server

      - name: Test all features
        if: runner.os == 'Linux'
        run: cargo test --all-features

      - name: Canonical encode vs serde_json arbitrary_precision
        if: runner.os == 'Linux'
        run: cargo test -p ap-check

  release-qualification:
    name: Release qualification (public artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false

      # Same libzmq shutdown fix as the validate job. This job is Linux-only.
      - name: Use patched libzmq C++ driver
        run: |
          echo "CORPUS_IPC_REAL_CXX=${CXX:-g++}" >> "$GITHUB_ENV"
          echo "CXX=$GITHUB_WORKSPACE/scripts/cxx-libzmq-pipefix.sh" >> "$GITHUB_ENV"

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - name: Cache cargo registry and git
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Cargo.lock is tracked for this repo, so every command asserts --locked.
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test all features
        run: |
          set +e
          cargo test --all-features --locked
          code=$?
          if [ "$code" -ne 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gdb
            bin=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'corpus_ipc-*' | head -1)
            echo "segfault binary=$bin"
            gdb -batch \
              -ex 'set pagination off' \
              -ex 'set confirm off' \
              -ex 'run' \
              -ex 'thread apply all bt' \
              --args "$bin" --test-threads=8
          fi
          exit "$code"

      - name: Canonical encode vs serde_json arbitrary_precision
        run: cargo test -p ap-check --locked

      - name: Docs (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features --locked

      - name: Package list
        run: cargo package --list --locked

      - name: Package
        run: cargo package --locked

      - name: Publish dry-run (no credentials)
        run: cargo publish --dry-run --locked

  # Python and Julia are not part of the Rust feature matrix. This job only
  # reads test-vectors/wire-v1 and does not compile the crate.
  wire-v1-conformance:
    name: Wire-v1 conformance (Python, Julia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      - name: Python wire-v1 conformance
        run: python3 conformance/python/check_wire_v1.py

      - name: Set up Julia 1.13
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.13"

      - name: Julia wire-v1 conformance
        run: |
          julia --project=conformance/julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=conformance/julia conformance/julia/check_wire_v1.jl
