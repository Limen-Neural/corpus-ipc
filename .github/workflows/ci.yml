name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache cargo registry and git
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Check default features
        run: cargo check --no-default-features

      - name: Check server feature
        run: cargo check --features server

      - name: Check zmq feature
        if: runner.os == 'Linux'
        run: cargo check --features zmq

      - name: Assert default tree excludes HTTP and ZMQ stacks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --no-default-features --edges normal)
          echo "$tree"
          if echo "$tree" | grep -E '(^|[[:space:]])(axum|tokio|tower|zmq) v'; then
            echo "default feature graph must not include axum, tokio, tower, or zmq"
            exit 1
          fi

      - name: Clippy (all features)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (server, no zmq)
        if: runner.os != 'Linux'
        run: cargo clippy --all-targets --features server -- -D warnings

      - name: Build default + server
        run: cargo build --features server

      - name: Build all features
        if: runner.os == 'Linux'
        run: cargo build --all-features

      - name: Test default + server
        run: cargo test --features server

      - name: Test all features
        if: runner.os == 'Linux'
        run: cargo test --all-features
